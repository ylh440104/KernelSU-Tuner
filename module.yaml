  - tuning
  - battery
  - system
icon: assets/icon.png
metamodule: false
authors:
  - name: ylh440104
    url: https://github.com/ylh440104
compatibility:
  androidMinApi: 29
  architectures:
    - arm64-v8a
    - x86_64
release:
  assetPattern: "KernelSU-Tuner-*.zip"